<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  *{box-sizing:border-box} body{position:fixed;inset:0;margin:0;width:1920px;height:1080px;overflow:hidden;background:#07131f;color:#eef5ff;font-family:Segoe UI,Arial,sans-serif}
  .app{display:grid;grid-template-columns:300px 1fr;height:1080px}.side{background:#0b1825;border-right:1px solid #203247;padding:28px 20px;position:relative}.brand{font-size:29px;font-weight:750}.sub{color:#7190b9;font-size:15px;margin-top:5px}.navtitle{margin:58px 16px 15px;color:#6984a8;letter-spacing:2px;font-size:14px}.nav{padding:17px 20px;margin:7px 0;border-radius:12px;font-size:20px;color:#a9c4e8}.nav.active{background:#1d3761;color:#fff;border-left:5px solid #5790ff}.status{position:absolute;left:20px;right:20px;bottom:26px;background:#0f2b26;border:1px solid #245c4b;border-radius:14px;padding:18px;color:#77e6a7}.main{padding:44px 56px;background:linear-gradient(160deg,#0b1724,#07121d)}
  .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}.title{font-size:38px;font-weight:750}.pill{display:inline-block;padding:8px 13px;border-radius:20px;background:#17375d;color:#75adff;font-size:16px}.green{background:#123d31;color:#64e69c}.purple{background:#372b62;color:#b8a1ff}.card{background:#111f32;border:1px solid #2a3b54;border-radius:16px;padding:28px;margin:18px 0;box-shadow:0 12px 30px #0004}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:22px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:22px}.metric{font-size:42px;font-weight:800;margin:8px 0}.muted{color:#94acd0}.button{display:inline-block;background:#3f70f4;color:white;padding:15px 24px;border-radius:10px;font-size:18px;font-weight:650}.line{height:1px;background:#2b3e57;margin:20px 0}.row{display:flex;align-items:center;gap:18px}.grow{flex:1}.table{width:100%;border-collapse:collapse;font-size:18px}.table td,.table th{text-align:left;padding:15px 18px;border-bottom:1px solid #29405a}.table th{color:#7898c3;font-size:15px;text-transform:uppercase}.check{color:#54df8c}.warn{color:#ffbb4f}.logo{width:52px;height:52px;border-radius:14px;background:#477bf5;display:inline-grid;place-items:center;margin-right:12px}.hero{padding:80px 60px}.hero h1{font-size:72px;margin:10px 0 22px;line-height:1.05}.hero p{font-size:30px;line-height:1.45;color:#aac0dc;max-width:980px}.accent{color:#65a0ff}.flow{display:flex;align-items:center;gap:16px;margin-top:58px}.node{background:#12253b;border:1px solid #315070;border-radius:14px;padding:18px 22px;font-size:20px}.arrow{color:#5893ff;font-size:30px}.chat{max-width:1220px;margin:auto}.bubble{background:#15243a;border:1px solid #2a3b55;border-radius:16px;padding:22px 26px;font-size:23px;margin:18px 0}.user{margin-left:280px;background:#1b2a41}.progress{padding:14px 20px;font-size:19px;color:#aac6e9}.spinner{display:inline-block;width:13px;height:13px;border-radius:50%;background:#6296ff;margin-right:14px}.code{font-family:Consolas,monospace;background:#091521;padding:22px;border-radius:12px;color:#a8d0ff;font-size:18px;line-height:1.5}.bar{height:18px;background:#1f354e;border-radius:12px;overflow:hidden}.bar span{display:block;height:100%;background:linear-gradient(90deg,#4b7fff,#9e64ff)}.small{font-size:17px}.scene{display:none}.scene.on{display:block}
</style>
</head>
<body><div id="root"></div>
<script>
const nav=(active)=>`<aside class="side"><div><span class="logo">⌁</span><span class="brand">Query Bench</span></div><div class="sub" style="margin-left:65px">AI-Powered SQL</div><div class="navtitle">MAIN</div>${['OpenAI Codex','Dashboard','Schema Explorer'].map(x=>`<div class="nav ${active===x?'active':''}">▣ &nbsp; ${x}</div>`).join('')}<div class="navtitle">TOOLS</div>${['Analytics','Database Context','Settings'].map(x=>`<div class="nav ${active===x?'active':''}">◆ &nbsp; ${x}</div>`).join('')}<div class="status">● &nbsp; Connected<br><span class="sub" style="margin-left:25px">Supabase PostgreSQL</span></div></aside>`;
const layout=(active,content)=>`<div class="app">${nav(active)}<main class="main">${content}</main></div>`;
const scenes={
1:layout('OpenAI Codex',`<div class="hero"><span class="pill">OPENAI BUILD WEEK</span><h1>Ask your database.<br><span class="accent">Get grounded answers.</span></h1><p>Query Bench turns plain-English questions into validated, read-only SQL—without asking business users to know schemas, joins, or database syntax.</p><div class="flow"><div class="node">Natural language</div><div class="arrow">→</div><div class="node">OpenAI Codex</div><div class="arrow">→</div><div class="node">Live database</div><div class="arrow">→</div><div class="node">Clear answer</div></div></div>`),
2:layout('Settings',`<div class="top"><div class="title">Settings</div><span class="pill green">Secure local profile</span></div><h2>Database Connections</h2><div class="card"><div class="row"><div class="logo">DB</div><div class="grow"><h2 style="margin:0">supabase-demo <span class="pill green">Active</span></h2><p class="muted">PostgreSQL · Supabase pooler · encrypted password</p></div><div class="button">Edit</div></div></div><div class="card"><h2>Bring your own database</h2><p class="muted" style="font-size:22px">PostgreSQL, MySQL, SQL Server, or Oracle. Profiles remain under the user's control.</p></div>`),
3:layout('Schema Explorer',`<div class="top"><div class="title">Schema Explorer</div><span class="pill green">Ready · 5 tables · 29 columns</span></div>${['customers · 6 columns','orders · 8 columns','products · 5 columns','stores · 5 columns'].map((x,i)=>`<div class="card row"><div class="logo">▦</div><div class="grow"><h2>${x}</h2><div class="muted">${i===1?'order_date · amount · discount · refund · tax':'Live schema introspection'}</div></div><span class="pill">Inspect</span></div>`).join('')}<div class="card"><b>Database Context</b><span class="muted"> &nbsp; Upload metric definitions, business rules, data dictionaries, and example SQL.</span></div>`),
4:layout('Dashboard',`<div class="top"><div class="title">Operational visibility</div><span class="pill">Query logs</span></div><div class="grid4"><div class="card"><div class="metric">14</div><div class="muted">Total queries</div></div><div class="card"><div class="metric check">92%</div><div class="muted">Success rate</div></div><div class="card"><div class="metric">8.3s</div><div class="muted">Average response</div></div><div class="card"><div class="metric">5</div><div class="muted">Tables explored</div></div></div><div class="card"><h2>Recent query logs</h2><table class="table"><tr><th>Status</th><th>Question</th><th>Model</th><th>Time</th></tr><tr><td class="check">● Success</td><td>Monthly revenue and net sales</td><td>Selected Codex model</td><td>8.1s</td></tr><tr><td class="check">● Success</td><td>Top products by revenue</td><td>Selected Codex model</td><td>6.7s</td></tr></table></div>`),
5:layout('OpenAI Codex',`<div class="top"><div class="title">OpenAI Codex</div><span class="pill green">✓ OpenAI connected</span></div><div class="grid"><div class="card"><h2>Sign in with OpenAI</h2><p class="muted" style="font-size:22px">Secure device authorization. No API key needs to be pasted into the application.</p><div class="button">Connected securely</div></div><div class="card"><h2>Choose an available model</h2><div class="line"></div><p>◉ &nbsp; Selected Codex model <span class="pill purple">Active</span></p><p class="muted">○ &nbsp; Other model available to this account</p><p class="muted">○ &nbsp; Faster model available to this account</p></div></div>`),
6:layout('OpenAI Codex',`<div class="top"><div class="title">OpenAI Codex</div><span class="pill">Live SSE progress</span></div><div class="chat"><div class="bubble user">Show me monthly revenue, refunds, discounts, and net sales. Highlight unusual trends.</div><div class="bubble"><div class="progress"><span class="spinner"></span>Searching for relevant tables… <span class="check">orders found</span></div><div class="progress"><span class="spinner"></span>Inspecting date and numeric columns… <span class="check">8 columns</span></div><div class="progress"><span class="spinner"></span>Generating monthly aggregation…</div><div class="progress"><span class="spinner"></span>Validating read-only SQL… <span class="check">valid</span></div><div class="progress"><span class="spinner"></span>Executing against Supabase…</div></div><div class="flow" style="justify-content:center;margin-top:28px"><div class="node">Codex chooses function</div><div class="arrow">→</div><div class="node">FastAPI executes</div><div class="arrow">→</div><div class="node">Result returns to Codex</div><div class="arrow">↻</div></div></div>`),
7:layout('OpenAI Codex',`<div class="top"><div class="title">Grounded business answer</div><span class="pill green">✓ Query completed</span></div><div class="grid"><div class="card"><h2>Key insights</h2><p style="font-size:23px"><b>December 2025</b> produced the strongest net sales.</p><p style="font-size:23px"><b>May 2026</b> had the highest refund total.</p><p style="font-size:23px"><b>June 2026</b> may be a partial month due to lower order volume.</p><div class="line"></div><span class="pill green">14 of 14 totals cross-checked</span></div><div class="card"><h2>Generated SQL</h2><div class="code">SELECT DATE_TRUNC('month', order_date),<br>&nbsp;&nbsp;SUM(amount) AS revenue,<br>&nbsp;&nbsp;SUM(refund) AS refunds,<br>&nbsp;&nbsp;SUM(discount) AS discounts,<br>&nbsp;&nbsp;SUM(amount-discount-refund+tax) AS net_sales<br>FROM orders GROUP BY 1 ORDER BY 1;</div></div></div>`),
8:layout('OpenAI Codex',`<div class="hero" style="padding-top:55px"><span class="pill">CORE TECHNOLOGY</span><h1 style="font-size:58px">Transparent AI for<br><span class="accent">real database work</span></h1><div class="flow" style="margin-top:35px;flex-wrap:wrap;max-width:1250px"><div class="node">Angular</div><div class="node">FastAPI</div><div class="node">SQLAlchemy</div><div class="node">OpenAI OAuth</div><div class="node">Function-calling loop</div><div class="node">SSE progress</div></div><p style="font-size:26px;margin-top:45px">Connect your database. Add your context. Ask the question.<br>Query Bench handles the investigation.</p></div>`)
};
const id=Number(new URLSearchParams(location.search).get('scene')||1);document.getElementById('root').innerHTML=scenes[id]||scenes[1];
</script></body></html>
